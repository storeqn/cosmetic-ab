<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>كوزمتك الأمير براند AB</title>

  <!-- PWA / Safari -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2b2d5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="كوزمتك الأمير براند AB">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <style>
    :root{
      --bg:#0f1026;
      --bg2:#171a3a;
      --text:#eef2ff;
      --muted:#b9c0ff;
      --line:rgba(255,255,255,.10);
      --brand:#ff4fa3;
      --brand2:#ff2a84;
      --ok:#16a34a;
      --danger:#ef4444;
      --shadow:0 14px 34px rgba(0,0,0,.25);
      --r:16px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,"Segoe UI",Tahoma,Arial;
      background:
        radial-gradient(1200px 600px at 50% -200px, rgba(255,79,163,.18), transparent 60%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--text);
      padding-bottom: 92px; /* مساحة لشريط السلة الثابت */
    }
    a{color:inherit; text-decoration:none}
    button,input,textarea{font-family:inherit}

    /* Header */
    header{
      position:sticky; top:0; z-index:50;
      background: rgba(18,20,48,.78);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .bar{
      max-width:1200px; margin:auto;
      padding:10px 12px;
      display:grid; grid-template-columns: 1fr auto 1fr;
      align-items:center; gap:10px;
    }
    .brand{
      justify-self:center;
      text-align:center;
    }
    .brand .t{
      font-weight:1000;
      font-size:18px;
      line-height:1.1;
      letter-spacing:.2px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .spark{
      width:10px;height:10px;border-radius:999px;
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,42,132,.95));
      box-shadow: 0 0 22px rgba(255,79,163,.55);
      display:inline-block;
    }
    .brand .s{
      margin-top:3px;
      font-size:12px;
      color: rgba(185,192,255,.95);
    }
    .leftTools,.rightTools{display:flex; gap:8px; align-items:center}
    .leftTools{justify-self:start}
    .rightTools{justify-self:end}

    .iconBtn{
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color:var(--text);
      border-radius:14px;
      padding:10px 12px;
      cursor:pointer;
      display:flex; gap:8px; align-items:center;
      font-weight:1000;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
      white-space:nowrap;
    }
    .badge{
      min-width:22px; height:22px; border-radius:999px;
      display:inline-flex; align-items:center; justify-content:center;
      background: rgba(255,79,163,.18);
      border: 1px solid rgba(255,79,163,.35);
      font-size:12px; font-weight:1000;
    }

    .pill{
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      border-radius:999px;
      padding:10px 12px;
      width:min(520px, 92vw);
      display:flex; gap:10px; align-items:center;
      margin:0 auto 10px;
    }
    .pill input{
      border:0; outline:0; width:100%;
      background:transparent; font-size:14px;
      color:var(--text);
    }
    .pill input::placeholder{color: rgba(185,192,255,.75)}

    /* ===== HERO SLIDER ===== */
    .hero{max-width:1200px;margin:14px auto 0;padding:0 12px}
    .heroGrid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px;align-items:stretch}
    @media (max-width: 900px){ .heroGrid{grid-template-columns:1fr} }

    .heroMain{
      display:grid;grid-template-columns:1.05fr .95fr;gap:12px;
      padding:14px;border-radius: var(--r);
      overflow:hidden;
    }
    @media (max-width: 900px){ .heroMain{grid-template-columns:1fr} }

    .heroMedia{position:relative;min-height:240px;display:flex;align-items:center;justify-content:center}
    .heroBlob{
      position:absolute;width:min(420px,85%);height:min(420px,85%);
      border-radius:50%;
      background: radial-gradient(circle at 30% 20%, rgba(255,79,163,.22), rgba(255,42,132,.10), transparent 70%);
      filter: blur(.2px);
    }
    .heroImg{
      position:relative;width:100%;max-height:320px;object-fit:contain;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.28));
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }
    .heroText{display:flex;flex-direction:column;justify-content:center;padding:6px}
    .heroTitle{font-size:32px;font-weight:1000;line-height:1.1;margin-top:6px}
    .heroActions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
    .heroDots{display:flex;gap:6px;align-items:center}
    .dot{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.25);cursor:pointer}
    .dot.active{width:18px;background:rgba(255,79,163,.95);border-color:rgba(255,79,163,.60)}

    .heroSide{display:flex;flex-direction:column;gap:12px}
    .sideCard{padding:14px;cursor:pointer}
    .sideTitle{font-weight:1000;font-size:16px}

    /* Bars (categories/subcategories/brands) */
    .catsWrap{
      max-width:1200px;
      margin:auto;
      padding:0 12px 12px;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .mini{
      color: rgba(185,192,255,.85);
      font-size:13px;
      line-height:1.55;
    }
    .cats{
      max-width:1200px;
      margin:auto;
      padding:0 12px 12px;
      display:flex;
      gap:8px;
      overflow:auto;
    }
    .catBtn{
      white-space:nowrap;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color:var(--text);
      border-radius:999px;
      padding:8px 12px;
      cursor:pointer;
      font-weight:900;
      font-size:13px;
    }
    .catBtn.active{
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,42,132,.95));
      border-color: rgba(255,79,163,.50);
    }

    /* Layout */
    .wrap{max-width:1200px; margin:auto; padding:14px 12px}
    .secHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin:12px 0 10px;
    }
    .secHead .h{font-size:16px; font-weight:1000}
    .secHead .sub{color: rgba(185,192,255,.85); font-size:13px}

    /* Product grid */
    .grid{
      display:grid; gap:12px;
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 980px){ .grid{grid-template-columns: repeat(3, 1fr);} }
    @media (max-width: 720px){ .grid{grid-template-columns: repeat(2, 1fr);} }

    .card{
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .posRel{position:relative}
    .img{
      width:100%;
      height:160px;
      object-fit:contain;
      background: rgba(255,255,255,.06);
      display:block;
      cursor:pointer;
    }
    @media (max-width: 720px){ .img{height:140px} }

    .p{padding:10px}
    .name{
      font-weight:1000;
      font-size:13.5px;
      line-height:1.25;
      min-height:34px;
      cursor:pointer;
    }
    .cat{
      font-size:12px;
      color: rgba(185,192,255,.85);
      margin-top:6px;
    }
    .row{
      display:flex;
      align-items:baseline;
      gap:8px;
      margin-top:10px;
      flex-wrap:wrap
    }
    .price{font-weight:1000; color:#ffd1ea; font-size:14px}
    .old{font-size:12px; color: rgba(185,192,255,.85); text-decoration:line-through}

    .btnRow{display:flex; gap:8px; margin-top:10px}
    .btn{
      flex:1;
      border-radius:14px;
      padding:10px 10px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
      font-weight:1000;
    }
    .btn.add{
      background: rgba(255,79,163,.16);
      border-color: rgba(255,79,163,.35);
    }
    .btn.order{
      background: linear-gradient(135deg, rgba(22,163,74,.95), rgba(34,197,94,.95));
      border-color: transparent;
      color:#fff;
    }

    .tag{
      position:absolute; top:10px; right:10px;
      background:rgba(239,68,68,.95);
      color:#fff;
      font-weight:1000;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
    }
    .tag2{
      position:absolute; top:10px; left:10px;
      background:rgba(255,79,163,.95);
      color:#fff;
      font-weight:1000;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
    }

    /* Always-visible cart bar (bottom) */
    .cartBar{
      position:fixed;
      left:12px; right:12px; bottom:12px;
      z-index:60;
      border-radius: 18px;
      border:1px solid rgba(255,255,255,.16);
      background: rgba(18,20,48,.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 46px rgba(0,0,0,.35);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:12px 12px;
      cursor:pointer;
    }
    .cartBar .sum{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 140px;
    }
    .cartBar .sum .t{font-size:12px; color: rgba(185,192,255,.85)}
    .cartBar .sum .v{font-weight:1000; font-size:14px}
    .cartBar .go{
      border:0;
      border-radius:14px;
      padding:12px 14px;
      font-weight:1000;
      color:#fff;
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,42,132,.95));
      display:flex; gap:10px; align-items:center;
      white-space:nowrap;
      pointer-events:none;
    }
    .cartBar .go .b{
      background: rgba(255,255,255,.20);
      border: 1px solid rgba(255,255,255,.25);
      border-radius:999px;
      padding:2px 8px;
      font-size:12px;
      font-weight:1000;
    }

    /* Drawers */
    .overlay{position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:90}
    .overlay.show{display:block}

    .drawer{
      position:fixed; top:0; left:0;
      height:100vh; width:min(440px, 94vw);
      background: #0f1026;
      box-shadow: 0 30px 70px rgba(0,0,0,.40);
      transform: translateX(-110%);
      transition: .2s ease;
      z-index:100;
      display:flex; flex-direction:column;
      border-right: 1px solid rgba(255,255,255,.10);
    }
    .drawer.open{transform:translateX(0)}
    .dHead{
      padding:14px;
      border-bottom:1px solid rgba(255,255,255,.10);
      display:flex; justify-content:space-between; align-items:center; gap:10px
    }
    .dHead .t{font-weight:1000}
    .x{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:var(--text);
      border-radius:12px;
      padding:8px 10px;
      cursor:pointer;
      font-weight:1000
    }
    .dBody{padding:14px; overflow:auto; flex:1}
    .dFoot{padding:14px; border-top:1px solid rgba(255,255,255,.10); background:rgba(255,255,255,.03)}

    .form{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
    .form input, .form textarea{
      border:1px solid rgba(255,255,255,.14);
      border-radius:14px;
      padding:10px 12px;
      outline:none;
      font-weight:700;
      background: rgba(255,255,255,.06);
      color: var(--text);
    }
    .form input::placeholder, .form textarea::placeholder{color: rgba(185,192,255,.70)}
    .form .full{grid-column:1 / -1}
    .sumLine{display:flex; justify-content:space-between; color: rgba(185,192,255,.85); font-size:13px; margin-top:6px}
    .sumLine b{color:var(--text)}
    .send{
      width:100%;
      border:0; cursor:pointer;
      border-radius:14px;
      padding:12px 12px;
      font-weight:1000;
      background: linear-gradient(135deg, rgba(255,79,163,.95), rgba(255,42,132,.95));
      color:#fff;
    }
    .clear{
      width:100%;
      border:1px solid rgba(239,68,68,.25);
      background: rgba(239,68,68,.08);
      color: #ffb4b4;
      border-radius:14px;
      padding:12px 12px;
      font-weight:1000;
      cursor:pointer;
      margin-top:8px;
    }

    .cartRow{
      display:flex; gap:10px;
      padding:10px 0;
      border-bottom:1px solid rgba(255,255,255,.10);
      align-items:flex-start;
    }
    .thumb{
      width:58px; height:58px;
      border-radius:14px;
      object-fit:contain;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10)
    }
    .cMain{flex:1}
    .cName{font-weight:1000; font-size:13px}
    .cMeta{color: rgba(185,192,255,.80); font-size:12px; margin-top:6px}
    .qty{display:flex; gap:8px; align-items:center; margin-top:8px}
    .qbtn{
      width:32px; height:32px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:var(--text);
      cursor:pointer;
      font-weight:1000
    }

    /* Product details drawer (right) */
    #prodDrawer{
      left:auto; right:0;
      transform:translateX(110%);
      border-right:0;
      border-left:1px solid rgba(255,255,255,.10)
    }
    #prodDrawer.open{transform:translateX(0)}
    .prodImg{
      width:100%;
      height:240px;
      object-fit:contain;
      background: rgba(255,255,255,.06);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
    }
  </style>
</head>

<body>
<header>
  <div class="bar">
    <div class="leftTools">
      <button class="iconBtn" onclick="openCart()">🛒 السلة <span class="badge" id="cartCount">0</span></button>
    </div>

    <div class="brand">
      <div class="t"><span class="spark"></span> كوزمتك الأمير براند AB</div>
      <div class="s">عطور • مكياج • عناية • عروض</div>
    </div>

    <div class="rightTools">
      <!-- Instagram icon only -->
      <a class="iconBtn" href="https://www.instagram.com/alameer.iq1/" target="_blank" title="Instagram"
         style="background:linear-gradient(135deg,#ff4fa3,#ff2a84);border-color:rgba(255,79,163,.45)">
        📸
      </a>

      <button class="iconBtn" onclick="scrollToShop()">🛍️ المنتجات</button>
    </div>
  </div>

  <div class="pill">
    🔎
    <input id="q" placeholder="ابحث عن منتج..." />
  </div>

  <div class="catsWrap">
    <button class="iconBtn" type="button" onclick="toggleCats()">📂 الأقسام</button>
    <div class="mini">اضغط لعرض الأقسام</div>
  </div>

  <div class="cats" id="catsBar" style="display:none"></div>
  <div class="cats" id="subCatsBar" style="display:none"></div>
  <div class="cats" id="brandsBar" style="display:none"></div>
</header>

<!-- HERO SLIDER -->
<section class="hero" id="hero">
  <div class="heroGrid">
    <div class="heroMain card">
      <div class="heroMedia">
        <div class="heroBlob"></div>
        <img id="heroImg" class="heroImg" src="" alt="">
      </div>

      <div class="heroText">
        <div id="heroKicker" class="mini">عروض كوزمتك</div>
        <div id="heroTitle" class="heroTitle">تحميل...</div>

        <div class="heroActions">

      <div class="sideCard card" onclick="heroPick('مكياج')">

          <div class="sideTitle">مكياج</div>
          <div class="mini">عرض المنتجات</div>
        </div>
      </div>

      <div class="sideCard card" onclick="heroPick('غسولات')">
        <div class="sideText">
          <div class="sideTitle">غسولات</div>
          <div class="mini">عرض المنتجات</div>
        </div>
      </div>
    </aside>

</section>

<div class="wrap">
  <div class="secHead" id="shopTop">
    <div>
      <div class="h">المنتجات</div>
      <div class="sub" id="status">تحميل...</div>
    </div>
  </div>

  <div id="grid" class="grid"></div>
</div>

<!-- Always visible cart bar -->
<div class="cartBar" onclick="openCart()">
  <div class="sum">
    <div class="t">إجمالي السلة</div>
    <div class="v" id="cartSum">0 د.ع</div>
  </div>
  <div class="go">
    فتح السلة <span class="b" id="cartQty">0</span>
  </div>
</div>

<!-- Overlay + Drawer (Cart) -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="drawer" id="cartDrawer" aria-hidden="true">
  <div class="dHead">
    <div class="t">🛒 السلة وإتمام الطلب</div>
    <button class="x" onclick="closeAll()">إغلاق</button>
  </div>
  <div class="dBody" id="cartBody"></div>
  <div class="dFoot">
    <div class="sumLine"><span>الإجمالي:</span> <b id="sumNew">0 د.ع</b></div>
    <div class="sumLine"><span>قبل الخصم:</span> <span id="sumOld">0 د.ع</span></div>
    <div class="sumLine"><span>التوفير:</span> <span id="sumSave">0 د.ع</span></div>

    <div class="form">
      <input id="name" placeholder="اسم الزبون" />
      <input id="phone" placeholder="رقم الهاتف" />
      <input id="address" class="full" placeholder="العنوان الكامل + أقرب نقطة" />
      <textarea id="note" class="full" rows="2" placeholder="ملاحظات (اختياري)"></textarea>
    </div>

    <button class="send" onclick="sendWhatsApp()">إرسال واتساب</button>
    <button class="clear" onclick="clearCart()">تفريغ السلة</button>

</div>

<!-- Drawer (Product details) -->
<div class="drawer" id="prodDrawer" aria-hidden="true">
  <div class="dHead">
    <div class="t" id="pTitle">تفاصيل المنتج</div>
    <button class="x" onclick="closeAll()">إغلاق</button>
  </div>
  <div class="dBody" id="pBody"></div>
</div>

<script>
  // ====== إعداداتك ======
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQR4CDYOcGSOeHqY-WPr6a-dDdFGqt6f_-wxzTnIjw26haO3oeWZX4AkJ7dqIoBeXKBaNnldf1gu_8x/pub?output=csv";
  const WHATSAPP_NUMBER = "9647733949777";

  const $ = (id)=>document.getElementById(id);

  const state = {
    products: [],
    cats: [],
    activeCat: "",
    activeSub: "",
    activeBrand: "",
    cart: loadCart()
  };

  function loadCart(){ try { return JSON.parse(localStorage.getItem("cart")||"{}"); } catch { return {}; } }
  function saveCart(){ localStorage.setItem("cart", JSON.stringify(state.cart)); updateCartUI(); }

  // إظهار/إخفاء الأقسام الرئيسية
  function toggleCats(){
    const bar = $("catsBar");
    const show = (bar.style.display === "none" || !bar.style.display);
    bar.style.display = show ? "flex" : "none";

    if(!show){
      $("subCatsBar").style.display = "none";
      $("brandsBar").style.display = "none";
    }else{
      renderSubCatsBar();
      renderBrandsBar();
    }
  }

  // CSV parser يدعم الفواصل داخل " "
  function splitLine(line){
    const out=[]; let cur=""; let inQ=false;
    for (let i=0;i<line.length;i++){
      const c=line[i];
      if (c === '"'){ inQ=!inQ; continue; }
      if (c === "," && !inQ){ out.push(cur); cur=""; continue; }
      cur += c;
    }
    out.push(cur);
    return out;
  }
  function parseCSV(text){
    const lines = text.trim().split(/\r?\n/);
    const headers = splitLine(lines[0]).map(x=>x.trim());
    return lines.slice(1).map(line=>{
      const cols = splitLine(line);
      const obj = {};
      headers.forEach((h,i)=>obj[h]=(cols[i]||"").trim());
      return obj;
    });
  }

  function money(n){ return (Number(n)||0).toLocaleString("ar-IQ"); }
  function pct(oldP, newP){
    oldP=Number(oldP||0); newP=Number(newP||0);
    if (!oldP || oldP<=newP) return 0;
    return Math.round(((oldP-newP)/oldP)*100);
  }
  function esc(s){ return String(s||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])); }

  // ===== HERO SLIDER =====
  let heroSlides = [];
  let heroIndex = 0;
  let heroTimer = null;

  function buildHeroDots(){
    const wrap = $("heroDots");
    wrap.innerHTML = "";
    heroSlides.forEach((_,i)=>{
      const d=document.createElement("div");
      d.className="dot"+(i===0?" active":"");
      d.onclick=()=>{ stopHeroAuto(); setHero(i); startHeroAuto(); };
      wrap.appendChild(d);
    });
  }

  function setHero(i){
    heroIndex = (i + heroSlides.length) % heroSlides.length;
    const s = heroSlides[heroIndex];

    $("heroKicker").textContent = s.kicker || "";
    $("heroTitle").textContent  = s.title  || "";
    $("heroSub").textContent    = s.sub    || "";

    const img = $("heroImg");
    if(s.img){
      img.src = s.img;
      img.style.display="block";
    }else{
      img.style.display="none";
    }

    const dots = $("heroDots").children;
    [...dots].forEach((d,idx)=>d.classList.toggle("active", idx===heroIndex));

    $("heroBtn").onclick = s.action || scrollToShop;
  }

  function startHeroAuto(){
    stopHeroAuto();
    heroTimer = setInterval(()=> setHero(heroIndex+1), 4500);
  }
  function stopHeroAuto(){ if(heroTimer){ clearInterval(heroTimer); heroTimer=null; } }

  function buildHeroFromProducts(){
    const offers = state.products.filter(p=>p.offer && p.image);
    const base = (offers.length ? offers : state.products.filter(p=>p.image)).slice(0,3);

    heroSlides = base.map(p=>({
      kicker: p.discount_note ? p.discount_note : (p.offer ? "عرض خاص" : "منتج مميز"),
      title: p.name,
      sub: p.category || "",
      img: p.image,
      action: ()=> openProduct(p.id)
    }));

    if(!heroSlides.length){
      heroSlides = [{
        kicker:"كوزمتك",
        title:"أهلاً بيك",
        sub:"اختاري من الأقسام بالأسفل",
        img:"",
        action: ()=> scrollToShop()
      }];
    }

    buildHeroDots();
    setHero(0);
    startHeroAuto();
  }

  function heroPick(cat){
    state.activeCat = cat;
    state.activeSub = "";
    state.activeBrand = "";
    renderCatsBar();
    renderSubCatsBar();
    renderBrandsBar();
    renderProducts();
    scrollToShop();
  }

  async function load(){
    try{
      const res = await fetch(SHEET_CSV_URL, {cache:"no-store"});
      const text = await res.text();
      const rows = parseCSV(text);

      state.products = rows
        .map((r, idx)=>({
          _i: idx,
          id: String(r.id||"").trim(),
          name: (r.name||"").trim(),
          price: Number(r.price||0),
          old_price: Number(r.old_price||0),
          offer: String(r.offer||"").toLowerCase().trim()==="yes",
          discount_note: (r.discount_note||"").trim(),
          image: (r.image||"").trim(),
          category: (r.category||"غير مصنف").trim(),
          sub_category: (r.sub_category||"").trim(),
          brand: (r.brand||"").trim(),
          desc: (r.desc||"").trim()
        }))
        .filter(p=>p.id && p.name && p.price);

      state.cats = [...new Set(state.products.map(p=>p.category))].sort((a,b)=>a.localeCompare(b,"ar"));

      $("status").textContent = `تم تحميل ${state.products.length} منتج`;
      renderCatsBar();
      renderSubCatsBar();
      renderBrandsBar();
      renderProducts();
      updateCartUI();

      // بناء السلايدر من المنتجات
      buildHeroFromProducts();
    }catch(e){
      $("status").textContent = "فشل التحميل: تأكد من رابط CSV وأن الشيت منشور.";
      console.error(e);
    }
  }

  // الأقسام الرئيسية
  function renderCatsBar(){
    const bar = $("catsBar");
    bar.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "catBtn" + (!state.activeCat ? " active" : "");
    allBtn.textContent = "الكل";
    allBtn.onclick = ()=>{
      state.activeCat = "";
      state.activeSub = "";
      state.activeBrand = "";
      setActiveBtn(bar, allBtn);
      renderSubCatsBar();
      renderBrandsBar();
      renderProducts();
      scrollToShop();
    };
    bar.appendChild(allBtn);

    state.cats.forEach(cat=>{
      const b = document.createElement("button");
      b.className = "catBtn" + (state.activeCat===cat ? " active" : "");
      b.textContent = cat;
      b.onclick = ()=>{
        state.activeCat = cat;
        state.activeSub = "";
        state.activeBrand = "";
        setActiveBtn(bar, b);
        renderSubCatsBar();
        renderBrandsBar();
        renderProducts();
        scrollToShop();
      };
      bar.appendChild(b);
    });
  }

  function setActiveBtn(container, btn){
    [...container.children].forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
  }

  // شريط الأقسام الفرعية
  function renderSubCatsBar(){
    const bar = $("subCatsBar");

    if(!state.activeCat){
      bar.style.display = "none";
      state.activeSub = "";
      return;
    }

    const subs = [...new Set(
      state.products
        .filter(p=>p.category===state.activeCat)
        .map(p=>p.sub_category)
        .filter(Boolean)
    )].sort((a,b)=>a.localeCompare(b,"ar"));

    if(!subs.length){
      bar.style.display = "none";
      state.activeSub = "";
      return;
    }

    if($("catsBar").style.display === "none"){ bar.style.display="none"; return; }

    bar.style.display = "flex";
    bar.innerHTML = "";

    const all = document.createElement("button");
    all.className = "catBtn" + (!state.activeSub ? " active" : "");
    all.textContent = "كل الأنواع";
    all.onclick = ()=>{
      state.activeSub = "";
      setActiveBtn(bar, all);
      renderBrandsBar();
      renderProducts();
    };
    bar.appendChild(all);

    subs.forEach(s=>{
      const btn = document.createElement("button");
      btn.className = "catBtn" + (state.activeSub===s ? " active" : "");
      btn.textContent = s;
      btn.onclick = ()=>{
        state.activeSub = s;
        state.activeBrand = "";
        setActiveBtn(bar, btn);
        renderBrandsBar();
        renderProducts();
      };
      bar.appendChild(btn);
    });
  }

  // شريط البراندات
  function renderBrandsBar(){
    const bar = $("brandsBar");

    if(!state.activeCat){
      bar.style.display = "none";
      state.activeBrand = "";
      return;
    }

    const brands = [...new Set(
      state.products
        .filter(p=>p.category===state.activeCat)
        .filter(p=>!state.activeSub || p.sub_category===state.activeSub)
        .map(p=>p.brand)
        .filter(Boolean)
    )].sort((a,b)=>a.localeCompare(b,"en"));

    if(!brands.length){
      bar.style.display = "none";
      state.activeBrand = "";
      return;
    }

    if($("catsBar").style.display === "none"){ bar.style.display="none"; return; }

    bar.style.display = "flex";
    bar.innerHTML = "";

    const all = document.createElement("button");
    all.className = "catBtn" + (!state.activeBrand ? " active" : "");
    all.textContent = "كل الشركات";
    all.onclick = ()=>{
      state.activeBrand = "";
      setActiveBtn(bar, all);
      renderProducts();
    };
    bar.appendChild(all);

    brands.forEach(b=>{
      const btn = document.createElement("button");
      btn.className = "catBtn" + (state.activeBrand===b ? " active" : "");
      btn.textContent = b;
      btn.onclick = ()=>{
        state.activeBrand = b;
        setActiveBtn(bar, btn);
        renderProducts();
      };
      bar.appendChild(btn);
    });
  }

  // فلترة المنتجات
  function baseFilter(){
    const q = ($("q").value||"").toLowerCase().trim();
    const cat = state.activeCat;
    const sub = state.activeSub;
    const br  = state.activeBrand;

    return state.products.filter(p=>{
      const okC = !cat || p.category===cat;
      const okSub = !sub || p.sub_category===sub;
      const okBr  = !br  || p.brand===br;
      const okQ = !q || p.name.toLowerCase().includes(q) || (p.desc||"").toLowerCase().includes(q);
      return okC && okSub && okBr && okQ;
    });
  }

  function renderProducts(){
    const list = baseFilter().sort((a,b)=>a._i-b._i);
    const grid = $("grid");
    grid.innerHTML = "";

    list.forEach(p=>{
      const hasDisc = p.old_price && p.old_price>p.price;
      const disc = hasDisc ? pct(p.old_price, p.price) : 0;

      let meta = p.category;
      const parts = [];
      if(p.sub_category) parts.push(p.sub_category);
      if(p.brand) parts.push(p.brand);
      if(parts.length) meta = parts.join(" • ");

      const card = document.createElement("div");
      card.className = "card posRel";
      card.innerHTML = `
        ${hasDisc ? `<div class="tag">خصم ${disc}%</div>` : ``}
        ${p.offer ? `<div class="tag2">${esc(p.discount_note || "عرض خاص")}</div>` : ``}

        <img class="img" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"
             onclick="openProduct('${p.id}')" onerror="this.style.display='none'">

        <div class="p">
          <div class="name" onclick="openProduct('${p.id}')">${esc(p.name)}</div>
          <div class="cat">${esc(meta)}</div>

          <div class="row">
            <div class="price">${money(p.price)} د.ع</div>
            ${hasDisc ? `<div class="old">${money(p.old_price)} د.ع</div>` : ``}
          </div>

          <div class="btnRow">
            <button class="btn add" onclick="addToCart('${p.id}')">إضافة للسلة</button>
            <button class="btn order" onclick="orderNow('${p.id}')">اطلب الآن</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    if(!list.length){
      grid.innerHTML = `<div class="mini" style="padding:14px;border:1px solid rgba(255,255,255,.10);border-radius:16px;background:rgba(255,255,255,.06)">
        لا توجد منتجات مطابقة للفلتر الحالي.
      </div>`;
    }
  }

  // تفاصيل المنتج
  function openProduct(id){
    const p = state.products.find(x=>x.id===id);
    if(!p) return;

    const hasDisc = p.old_price && p.old_price>p.price;
    const disc = hasDisc ? pct(p.old_price, p.price) : 0;

    let info = p.category || "";
    const parts = [];
    if(p.sub_category) parts.push(p.sub_category);
    if(p.brand) parts.push(p.brand);
    if(parts.length) info = parts.join(" • ");

    $("pTitle").textContent = p.name;
    $("pBody").innerHTML = `
      <img class="prodImg" src="${esc(p.image)}" onerror="this.style.display='none'">
      <div style="margin-top:12px; font-weight:1000; font-size:16px">${esc(p.name)}</div>
      <div class="mini" style="margin-top:6px">${esc(info)}</div>

      <div class="mini" style="
        margin-top:10px;
        white-space:pre-wrap;
        line-height:1.9;
        font-size:14px;
        overflow-wrap:anywhere;
        word-break:break-word;
      ">
        ${esc(p.desc || "")}
      </div>

      <div style="margin-top:12px" class="row">
        <div class="price">${money(p.price)} د.ع</div>
        ${hasDisc ? `<div class="old">${money(p.old_price)} د.ع</div>` : ``}
        ${hasDisc ? `<span class="badge" style="height:auto;padding:4px 10px">خصم ${disc}%</span>` : ``}
      </div>

      <div class="btnRow" style="margin-top:14px">
        <button class="btn add" onclick="addToCart('${p.id}')">إضافة للسلة</button>
        <button class="btn order" onclick="orderNow('${p.id}')">اطلب الآن</button>
      </div>
    `;

    showOverlay(true);
    $("prodDrawer").classList.add("open");
  }

  // السلة
  function addToCart(id){
    state.cart[id] = (state.cart[id]||0) + 1;
    saveCart();
  }
  function orderNow(id){
    addToCart(id);
    openCart();
  }

  function cartItems(){
    return Object.entries(state.cart).map(([id,qty])=>{
      const p = state.products.find(x=>x.id===id);
      if(!p) return null;
      const oldp = p.old_price && p.old_price>0 ? p.old_price : p.price;
      return { ...p, qty, lineNew:p.price*qty, lineOld:oldp*qty };
    }).filter(Boolean);
  }

  function updateCartUI(){
    const qty = Object.values(state.cart).reduce((a,b)=>a+b,0);
    $("cartCount").textContent = qty;
    $("cartQty").textContent = qty;

    const items = cartItems();
    const sumNew = items.reduce((a,b)=>a+b.lineNew,0);
    $("cartSum").textContent = `${money(sumNew)} د.ع`;
  }

  function openCart(){
    renderCart();
    showOverlay(true);
    $("cartDrawer").classList.add("open");
  }

  function renderCart(){
    const items = cartItems();
    const body = $("cartBody");

    if(!items.length){
      body.innerHTML = `<div class="mini">السلة فارغة.</div>`;
    }else{
      body.innerHTML = items.map(it=>`
        <div class="cartRow">
          <img class="thumb" src="${esc(it.image)}" onerror="this.style.display='none'">
          <div class="cMain">
            <div class="cName">${esc(it.name)}</div>
            <div class="cMeta">${money(it.price)} د.ع • عدد: ${it.qty}</div>
            <div class="qty">
              <button class="qbtn" onclick="dec('${it.id}')">-</button>
              <b>${it.qty}</b>
              <button class="qbtn" onclick="inc('${it.id}')">+</button>
              <button class="qbtn" style="margin-inline-start:auto" onclick="removeItem('${it.id}')">✕</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    const sumNew = items.reduce((a,b)=>a+b.lineNew,0);
    const sumOld = items.reduce((a,b)=>a+b.lineOld,0);
    const save = Math.max(0, sumOld - sumNew);

    $("sumNew").textContent = `${money(sumNew)} د.ع`;
    $("sumOld").textContent = `${money(sumOld)} د.ع`;
    $("sumSave").textContent = `${money(save)} د.ع`;
  }

  function inc(id){ state.cart[id]=(state.cart[id]||0)+1; saveCart(); renderCart(); }
  function dec(id){
    if(!state.cart[id]) return;
    state.cart[id]--;
    if(state.cart[id]<=0) delete state.cart[id];
    saveCart(); renderCart();
  }
  function removeItem(id){ delete state.cart[id]; saveCart(); renderCart(); }
  function clearCart(){ state.cart={}; saveCart(); renderCart(); }

  // إرسال واتساب
  function sendWhatsApp(){
    const items = cartItems();
    if(!items.length){ alert("السلة فارغة"); return; }

    const name = $("name").value.trim();
    const phone = $("phone").value.trim();
    const address = $("address").value.trim();
    const note = $("note").value.trim();

    if(!name || !phone || !address){
      alert("اكتب الاسم + الهاتف + العنوان");
      return;
    }

    const sumNew = items.reduce((a,b)=>a+b.lineNew,0);
    const sumOld = items.reduce((a,b)=>a+b.lineOld,0);
    const save = Math.max(0, sumOld - sumNew);

    let msg = `طلب جديد - كوزمتك الأمير براند AB%0A%0A`;
    msg += `الاسم: ${encodeURIComponent(name)}%0A`;
    msg += `الهاتف: ${encodeURIComponent(phone)}%0A`;
    msg += `العنوان: ${encodeURIComponent(address)}%0A`;
    if(note) msg += `ملاحظات: ${encodeURIComponent(note)}%0A`;
    msg += `%0Aالمنتجات:%0A`;

    items.forEach((it,i)=>{
      const line = `${i+1}) ${it.name} | عدد: ${it.qty} | سعر: ${it.price} | مجموع: ${it.lineNew}`;
      msg += `${encodeURIComponent(line)}%0A`;
    });

    msg += `%0Aالإجمالي قبل الخصم: ${sumOld}%0A`;
    msg += `الإجمالي بعد الخصم: ${sumNew}%0A`;
    msg += `التوفير: ${save}%0A`;

    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
  }

  function showOverlay(on){
    const o=$("overlay");
    if(on) o.classList.add("show");
    else o.classList.remove("show");
  }
  function closeAll(){
    showOverlay(false);
    $("cartDrawer").classList.remove("open");
    $("prodDrawer").classList.remove("open");
  }

  function scrollToShop(){ $("shopTop").scrollIntoView({behavior:"smooth"}); }

  $("q").addEventListener("input", renderProducts);

  load();
</script>
</body>
</html>
