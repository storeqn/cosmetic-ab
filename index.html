<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>كوزمتك الأمير براند AB</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

/* ===== ثيم أنثوي ===== */
:root{
  --bg:#0b0813;
  --bg2:#160b22;
  --text:#fff7fb;
  --muted:#ffd6e7;
  --primary:#ff4fa3;
  --primary2:#ff2a84;
  --card:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.15);
  --r:18px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Cairo",sans-serif;
  color:var(--text);
  background:
    radial-gradient(900px 520px at 50% -140px, rgba(255,79,163,.35), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}

/* ===== HEADER ===== */
header{
  text-align:center;
  padding:14px;
  font-size:22px;
  font-weight:900;
}

/* ===== HERO SLIDER ===== */
.hero{max-width:1100px;margin:10px auto;padding:10px}
.heroBox{
  background:var(--card);
  border-radius:var(--r);
  padding:16px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
@media(max-width:800px){
  .heroBox{grid-template-columns:1fr}
}

.heroImg{
  width:100%;
  max-height:320px;
  object-fit:contain;
}

.heroTitle{
  font-size:34px;
  font-weight:900;
}

.heroSub{
  color:var(--muted);
  margin:8px 0;
}

.heroBtn{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  border:0;
  color:#fff;
  padding:12px 18px;
  border-radius:14px;
  font-weight:900;
  cursor:pointer;
}

/* ===== PRODUCTS ===== */
.wrap{max-width:1100px;margin:auto;padding:12px}
.grid{
  display:grid;
  gap:12px;
  grid-template-columns:repeat(3,1fr);
}
@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr);}
}

.card{
  background:var(--card);
  border-radius:var(--r);
  padding:10px;
}

.img{
  width:100%;
  height:160px;
  object-fit:contain;
}

.name{font-weight:900;margin:6px 0}
.price{color:var(--primary);font-weight:900}

.btn{
  width:100%;
  margin-top:6px;
  padding:10px;
  border-radius:12px;
  border:0;
  cursor:pointer;
  font-weight:900;
}
.btnAdd{background:#333;color:#fff}
.btnOrder{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}

</style>
</head>

<body>

<header>
كوزمتك الأمير براند AB
</header>

<!-- ===== SLIDER ===== -->
<section class="hero">
  <div class="heroBox">
    <div>
      <img id="heroImg" class="heroImg">
    </div>
    <div>
      <div id="heroTitle" class="heroTitle"></div>
      <div id="heroSub" class="heroSub"></div>
      <button id="heroBtn" class="heroBtn">عرض المنتجات</button>
    </div>
  </div>
</section>

<!-- ===== PRODUCTS ===== -->
<div class="wrap">
  <div id="grid" class="grid"></div>
</div>

<script>

// ===== رابط الشيت =====
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQR4CDYOcGSOeHqY-WPr6a-dDdFGqt6f_-wxzTnIjw26haO3oeWZX4AkJ7dqIoBeXKBaNnldf1gu_8x/pub?output=csv";

// ===== رقم واتساب =====
const WHATSAPP = "9647733949777";

// ===== SLIDER DATA =====
const slides = [
 {title:"عطور فاخرة", sub:"أفضل العطور النسائية", img:"https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&w=900"},
 {title:"مكياج", sub:"أحدث الماركات", img:"https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&w=900"},
 {title:"عناية بالبشرة", sub:"منتجات أصلية", img:"https://images.unsplash.com/photo-1556228578-0d85b1a4d571?auto=format&w=900"}
];

let slideIndex=0;

function showSlide(){
  const s=slides[slideIndex];
  heroImg.src=s.img;
  heroTitle.textContent=s.title;
  heroSub.textContent=s.sub;
  slideIndex=(slideIndex+1)%slides.length;
}
setInterval(showSlide,4000);
showSlide();

heroBtn.onclick=()=>document.getElementById("grid").scrollIntoView({behavior:"smooth"});

// ===== CSV PARSER =====
function parseCSV(text){
  const rows=text.trim().split("\n").map(r=>r.split(","));
  const headers=rows.shift();
  return rows.map(r=>{
    const o={};
    headers.forEach((h,i)=>o[h]=r[i]);
    return o;
  });
}

// ===== LOAD PRODUCTS =====
fetch(SHEET_URL)
.then(r=>r.text())
.then(t=>{
  const data=parseCSV(t);
  render(data);
});

function render(products){
  grid.innerHTML="";
  products.forEach(p=>{
    if(!p.name) return;
    const d=document.createElement("div");
    d.className="card";
    d.innerHTML=`
      <img class="img" src="${p.image}">
      <div class="name">${p.name}</div>
      <div class="price">${p.price} د.ع</div>
      <button class="btn btnAdd" onclick="add('${p.name}')">إضافة للسلة</button>
      <button class="btn btnOrder" onclick="order('${p.name}')">اطلب الآن</button>
    `;
    grid.appendChild(d);
  });
}

// ===== CART SIMPLE =====
let cart=[];

function add(name){
  cart.push(name);
  alert("تمت الإضافة");
}

function order(name){
  const msg=`طلب منتج: ${name}`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`);
}

</script>

</body>
</html>
